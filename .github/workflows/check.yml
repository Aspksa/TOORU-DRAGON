name: Windows portable check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bundled runtime
        shell: cmd
        run: call SETUP.bat --quiet
      - name: Test with portable Python
        shell: cmd
        run: python\python.exe -X utf8 tests\test_core.py
